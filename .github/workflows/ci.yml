name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: .NET build and tests
        run: |
          dotnet build LitWeave.sln -c Release
          dotnet test LitWeave.sln -c Release --no-build
      - name: Secret and personal-data scan
        shell: pwsh
        run: |
          $patterns = 'api[_-]?key\s*[:=]|BEGIN (RSA|OPENSSH|PRIVATE)|AppData\\Roaming\\Zotero|[A-Za-z]:\\Users\\[^\\s]+\\Zotero'
          $files = Get-ChildItem -Path . -Recurse -File -Force |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\node_modules\\|\\bin\\|\\obj\\' }
          $hits = $files | Select-String -Pattern $patterns -CaseSensitive:$false
          if ($hits) { Write-Error "Potential secret or personal Zotero data found:`n$($hits -join "`n")" }
