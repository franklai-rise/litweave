name: Release LitWeave

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build self-contained portable app
        shell: pwsh
        run: |
          ./packaging/build-release.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\LitWeave.iss'
      - name: Hash release assets
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)"
          } | Set-Content artifacts\SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName
          gh release create $tag @assets --title "LitWeave $tag" --notes-file RELEASE_NOTES.md
